worker_processes auto;
events { worker_connections 1024; }

http {
  log_format main '$remote_addr "$request" $status $request_time '
                  'upstream=$upstream_addr upstream_time=$upstream_response_time request_id=$request_id';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  gzip on;
  gzip_types application/json;
  gzip_min_length 1024;

  # Грубая защита от флуда на входе: 50 запросов/с с IP с запасом на всплески.
  # Бизнес-лимит (100 в минуту) считает само приложение в Redis.
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=50r/s;
  limit_req_status 429;

  upstream deals {
    server haproxy:8000;
    keepalive 32;
  }
  upstream analytics {
    server analytics:3001;
    keepalive 16;
  }

  server {
    listen 8080;
    client_max_body_size 16k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Перезаписываем, а не дописываем: клиент не может подделать свой IP своим X-Forwarded-For.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    add_header X-Request-Id $request_id always;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    limit_req zone=per_ip burst=100 nodelay;

    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    location /analytics/ {
      proxy_pass http://analytics;
    }

    location / {
      proxy_pass http://deals;
    }
  }
}
