global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  timeout connect 2s
  timeout client 30s
  timeout server 10s
  # Повтор только при ошибке соединения (запрос ещё не ушёл) — оплату дважды не отправим.
  retries 2
  option redispatch

frontend deals_in
  bind :8000
  # Дописывает адрес nginx в X-Forwarded-For: приложение видит "client, nginx" и доверяет двум прокси.
  option forwardfor
  default_backend deals

backend deals
  balance leastconn
  option httpchk GET /health
  http-check expect status 200
  # До 8 слотов под реплики сервиса deals: DNS Docker отдаёт по адресу на реплику,
  # haproxy заполняет слоты и сам подхватывает добавленные или убранные реплики (--scale deals=N).
  default-server inter 2s fall 2 rise 2 init-addr none resolvers docker resolve-prefer ipv4
  http-response set-header X-Served-By %s
  server-template deals- 8 deals:3000 check

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

listen stats
  bind :8404
  stats enable
  stats uri /stats
  stats refresh 5s
  # Встроенный экспортёр метрик для Prometheus.
  http-request use-service prometheus-exporter if { path /metrics }
